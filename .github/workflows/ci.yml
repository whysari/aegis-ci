name: Aegis-CI Multi-Agent Release Gate & Postgres Lock Analyzer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify-release-gate:
    name: Unit Tests & 30-PR Zero-Rollback Benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Unit Tests
        run: python3 -m unittest discover -s tests -v
      - name: Run 30-PR Multi-Agent Release Gate Benchmark
        run: python3 benchmarks/run_aegis_benchmark.py
