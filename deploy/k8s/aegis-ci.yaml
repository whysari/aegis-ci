apiVersion: v1
kind: Namespace
metadata:
  name: aegis-ci
  labels:
    app.kubernetes.io/part-of: aegis-ci
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegis-api
  namespace: aegis-ci
  labels:
    app: aegis-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aegis-api
  template:
    metadata:
      labels:
        app: aegis-api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/whysari/aegis-api:1.1.0
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8010
          volumeMounts:
            - name: aegis-data
              mountPath: /data
            - name: tmp-dir
              mountPath: /tmp
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /api/v1/healthz
              port: http
          readinessProbe:
            httpGet:
              path: /api/v1/healthz
              port: http
      volumes:
        - name: aegis-data
          emptyDir:
            sizeLimit: 256Mi
        - name: tmp-dir
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: aegis-api
  namespace: aegis-ci
spec:
  selector:
    app: aegis-api
  ports:
    - name: http
      port: 8010
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aegis-network-policy
  namespace: aegis-ci
spec:
  podSelector:
    matchLabels:
      app: aegis-api
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 8010
